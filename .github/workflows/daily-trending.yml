name: Daily GitHub Trending

on:
  schedule:
    # 매일 오전 9시 (KST = UTC+9, 즉 UTC 00:00)
    - cron: "0 0 * * *"
  workflow_dispatch:  # 수동 실행 버튼

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate trending page
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TRENDING_TOKEN }}
        run: node generate_page.js

      - name: Commit & Push docs/index.html
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --cached --quiet || git commit -m "chore: update trending $(date -u +'%Y-%m-%d')"
          git push
